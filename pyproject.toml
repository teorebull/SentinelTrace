[project]
name = "sentineltrace"
version = "0.1.0"
description = "An agentic authentication-security investigation project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ipython>=9.17.1",
    "langchain>=1.4.2",
    "langgraph>=1.2.11",
    "ollama>=0.6.2",
    "pandas>=2.2",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentineltrace"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[project.scripts]
sentineltrace = "sentineltrace.cli:main"
