<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120">
  <style>
    text { font-family: Arial, sans-serif; fill: #1e1e1e; }
    .title { font-size: 32px; font-weight: bold; }
    .heading { font-size: 22px; font-weight: bold; }
    .body { font-size: 17px; }
    .small { font-size: 15px; fill: #555; }
    .box { stroke-width: 2; rx: 12; }
    .arrow { stroke: #555; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    .dashed { stroke-dasharray: 8 6; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L10,3 L0,6 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="1600" height="1120" fill="white"/>
  <text x="800" y="42" text-anchor="middle" class="title">SentinelTrace - Agentic Threat Investigator</text>
  <text x="800" y="72" text-anchor="middle" class="small">Deterministic security evidence first; probabilistic reasoning later</text>

  <rect x="35" y="105" width="440" height="570" fill="#dbe4ff" fill-opacity=".45" stroke="#4a9eed" class="box"/>
  <text x="60" y="140" class="heading" fill="#2563eb">CURRENT REPOSITORY - Phase 0-1</text>
  <rect x="70" y="175" width="170" height="78" fill="#a5d8ff" stroke="#4a9eed" class="box"/>
  <text x="155" y="207" text-anchor="middle" class="body">CLI skeleton</text><text x="155" y="230" text-anchor="middle" class="body">sentineltrace.cli</text>
  <rect x="270" y="175" width="170" height="78" fill="#d0bfff" stroke="#8b5cf6" class="box"/>
  <text x="355" y="207" text-anchor="middle" class="body">Models</text><text x="355" y="230" text-anchor="middle" class="body">events.py</text>
  <rect x="70" y="295" width="170" height="98" fill="#c3fae8" stroke="#06b6d4" class="box"/>
  <text x="155" y="326" text-anchor="middle" class="body">Data layer</text><text x="155" y="349" text-anchor="middle" class="body">loaders.py</text><text x="155" y="372" text-anchor="middle" class="body">repository.py</text>
  <rect x="270" y="295" width="170" height="98" fill="#d0bfff" stroke="#8b5cf6" class="box"/>
  <text x="355" y="326" text-anchor="middle" class="body">Analysis</text><text x="355" y="349" text-anchor="middle" class="body">authentication.py</text><text x="355" y="372" text-anchor="middle" class="body">timelines.py</text>
  <rect x="70" y="445" width="370" height="105" fill="#ffc9c9" stroke="#ef4444" class="box"/>
  <text x="255" y="477" text-anchor="middle" class="body">No LLM / LangGraph / API</text><text x="255" y="501" text-anchor="middle" class="body">Synthetic or authorized data only</text><text x="255" y="525" text-anchor="middle" class="body">Pandas + Pydantic, pytest + Ruff</text>
  <path d="M155 253 V295 M355 253 V295" class="arrow"/>

  <rect x="515" y="105" width="1050" height="570" fill="#e5dbff" fill-opacity=".45" stroke="#8b5cf6" class="box"/>
  <text x="545" y="140" class="heading" fill="#6d28d9">TARGET BLUEPRINT - grows in deliberate phases</text>
  <rect x="550" y="175" width="180" height="80" fill="#a5d8ff" stroke="#4a9eed" class="box"/>
  <text x="640" y="208" text-anchor="middle" class="body">Entry points</text><text x="640" y="232" text-anchor="middle" class="body">CLI now / FastAPI later</text>
  <rect x="785" y="175" width="205" height="80" fill="#d0bfff" stroke="#8b5cf6" class="box"/>
  <text x="887" y="208" text-anchor="middle" class="body">Investigation Service</text><text x="887" y="232" text-anchor="middle" class="body">domain orchestration</text>
  <rect x="1045" y="160" width="245" height="110" fill="#d0bfff" stroke="#8b5cf6" class="box"/>
  <text x="1167" y="193" text-anchor="middle" class="body">Bounded Agent</text><text x="1167" y="217" text-anchor="middle" class="body">manual loop -> LangGraph</text><text x="1167" y="241" text-anchor="middle" class="body">state / policies / prompts</text>
  <rect x="1330" y="175" width="200" height="80" fill="#ffd8a8" stroke="#f59e0b" class="box"/>
  <text x="1430" y="208" text-anchor="middle" class="body">Guardrails</text><text x="1430" y="232" text-anchor="middle" class="body">call / time / cost budgets</text>
  <path d="M730 215 H785 M990 215 H1045" class="arrow"/>

  <rect x="575" y="350" width="200" height="100" fill="#d0bfff" stroke="#8b5cf6" class="box"/>
  <text x="675" y="382" text-anchor="middle" class="body">Log tools</text><text x="675" y="406" text-anchor="middle" class="body">failed / successful logins</text><text x="675" y="430" text-anchor="middle" class="body">user events</text>
  <rect x="820" y="350" width="200" height="100" fill="#d0bfff" stroke="#8b5cf6" class="box"/>
  <text x="920" y="382" text-anchor="middle" class="body">Baseline tools</text><text x="920" y="406" text-anchor="middle" class="body">new IP / country / device</text><text x="920" y="430" text-anchor="middle" class="body">compare behavior</text>
  <rect x="1065" y="350" width="200" height="100" fill="#d0bfff" stroke="#8b5cf6" class="box"/>
  <text x="1165" y="382" text-anchor="middle" class="body">Context tools</text><text x="1165" y="406" text-anchor="middle" class="body">timeline / IP usage</text><text x="1165" y="430" text-anchor="middle" class="body">post-login activity</text>
  <rect x="1310" y="350" width="220" height="100" fill="#ffd8a8" stroke="#f59e0b" stroke-dasharray="8 6" class="box"/>
  <text x="1420" y="382" text-anchor="middle" class="body">Threat Intel later</text><text x="1420" y="406" text-anchor="middle" class="body">authorized IP reputation API</text><text x="1420" y="430" text-anchor="middle" class="body">signal, not proof</text>
  <path d="M1167 270 V350" class="arrow"/>

  <rect x="575" y="525" width="210" height="95" fill="#c3fae8" stroke="#06b6d4" class="box"/>
  <text x="680" y="556" text-anchor="middle" class="body">Synthetic datasets</text><text x="680" y="580" text-anchor="middle" class="body">known scenarios + ground truth</text><text x="680" y="604" text-anchor="middle" class="body">SecurityEvent records</text>
  <rect x="825" y="525" width="210" height="95" fill="#c3fae8" stroke="#06b6d4" class="box"/>
  <text x="930" y="556" text-anchor="middle" class="body">Loader + repository</text><text x="930" y="580" text-anchor="middle" class="body">validate / filter / query</text><text x="930" y="604" text-anchor="middle" class="body">in-memory or files first</text>
  <rect x="1075" y="525" width="190" height="95" fill="#b2f2bb" stroke="#22c55e" class="box"/>
  <text x="1170" y="556" text-anchor="middle" class="body">Evidence ledger</text><text x="1170" y="580" text-anchor="middle" class="body">IDs / facts / sources</text><text x="1170" y="604" text-anchor="middle" class="body">structured results</text>
  <rect x="1310" y="525" width="220" height="95" fill="#b2f2bb" stroke="#22c55e" class="box"/>
  <text x="1420" y="556" text-anchor="middle" class="body">Structured report</text><text x="1420" y="580" text-anchor="middle" class="body">fact / inference / unknown</text><text x="1420" y="604" text-anchor="middle" class="body">recommendation + confidence</text>
  <path d="M680 525 V450 M930 525 V450 M1167 270 V525 M1265 572 H1310 M785 572 H825" class="arrow"/>
  <text x="550" y="650" class="small">Tools return structured data. Narrative interpretation follows evidence collection.</text>

  <rect x="35" y="720" width="1530" height="365" fill="#fff3bf" fill-opacity=".5" stroke="#f59e0b" class="box"/>
  <text x="65" y="755" class="heading" fill="#b45309">DELIVERY ROADMAP + NON-NEGOTIABLES</text>
  <g class="body">
    <rect x="70" y="790" width="260" height="125" fill="#a5d8ff" stroke="#4a9eed" class="box"/><text x="200" y="823" text-anchor="middle">1  Prove facts</text><text x="200" y="847" text-anchor="middle">load -> filter -> timeline</text><text x="200" y="871" text-anchor="middle">baseline -> tested report</text><text x="200" y="895" text-anchor="middle">NO GenAI</text>
    <rect x="370" y="790" width="260" height="125" fill="#d0bfff" stroke="#8b5cf6" class="box"/><text x="500" y="823" text-anchor="middle">2  Learn workflow</text><text x="500" y="847" text-anchor="middle">manual investigator</text><text x="500" y="871" text-anchor="middle">fixed tool order</text><text x="500" y="895" text-anchor="middle">understand before automating</text>
    <rect x="670" y="790" width="260" height="125" fill="#d0bfff" stroke="#8b5cf6" class="box"/><text x="800" y="823" text-anchor="middle">3  Add reasoning</text><text x="800" y="847" text-anchor="middle">LLM loop -> LangGraph</text><text x="800" y="871" text-anchor="middle">bounded state + stopping rules</text>
    <rect x="970" y="790" width="260" height="125" fill="#ffd8a8" stroke="#f59e0b" class="box"/><text x="1100" y="823" text-anchor="middle">4  Enrich + expose</text><text x="1100" y="847" text-anchor="middle">threat intel / RAG</text><text x="1100" y="871" text-anchor="middle">FastAPI -> Docker -> cloud</text>
    <rect x="1270" y="790" width="260" height="125" fill="#eebefa" stroke="#ec4899" class="box"/><text x="1400" y="823" text-anchor="middle">5  Evaluate</text><text x="1400" y="847" text-anchor="middle">direct-LLM baseline vs agent</text><text x="1400" y="871" text-anchor="middle">precision / recall / cost / latency</text>
  </g>
  <path d="M330 852 H370 M630 852 H670 M930 852 H970 M1230 852 H1270" class="arrow"/>
  <rect x="70" y="950" width="1460" height="90" fill="#ffc9c9" stroke="#ef4444" class="box"/>
  <text x="800" y="982" text-anchor="middle" class="body">Trust model: facts come from Python; claims cite evidence IDs; missing information stays unknown.</text>
  <text x="800" y="1007" text-anchor="middle" class="body">Reputation and anomaly scores are signals, not proof. Use authorized defensive data only.</text>
  <text x="800" y="1032" text-anchor="middle" class="body">No credential attacks, evasion, malware, or destructive remediation.</text>
  <text x="70" y="1075" class="small">Blue = interface/input   Purple = processing/agent   Teal = data/storage   Green = evidence/output   Amber = future/external   Red = safety boundary</text>
</svg>
